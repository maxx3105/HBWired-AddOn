name: Build Addon

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "VERSION=$(cat src/addon/VERSION)" >> $GITHUB_OUTPUT

      - name: Build tgz
        run: |
          mkdir -p staging
          cp -r src/addon src/ccu1 src/ccu2 src/ccu3 src/ccurm src/www src/rc.d src/update_script staging/
          chmod +x staging/update_script
          chmod +x staging/rc.d/hbwired
          chmod +x staging/addon/installHBWired
          chmod +x staging/addon/inst_strings.sh
          chmod +x staging/ccu1/update_addon
          chmod +x staging/ccu2/update_addon
          chmod +x staging/ccu3/update_addon
          chmod +x staging/ccurm/update_addon
          tar czf hbwired-addon_${{ steps.version.outputs.VERSION }}.tgz \
            --owner=root --group=root \
            -C staging \
            .

      - name: Create Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: "HBWired AddOn v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          files: hbwired-addon_${{ steps.version.outputs.VERSION }}.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Draft Release (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          name: "HBWired AddOn v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ steps.version.outputs.VERSION }}
          files: hbwired-addon_${{ steps.version.outputs.VERSION }}.tgz
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
