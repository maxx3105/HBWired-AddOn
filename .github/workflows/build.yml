name: Build Addon

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "VERSION=$(cat src/addon/VERSION)" >> $GITHUB_OUTPUT

      - name: Build tgz
        run: |
          cd src
          tar czf ../hbwired-addon_${{ steps.version.outputs.VERSION }}.tgz \
            --owner=root --group=root \
            --transform 's|^|./|' \
            addon/ ccu1/ ccu2/ ccu3/ ccurm/ www/ rc.d/ update_script

      - name: Create Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: "HBWired CCU Addon v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          files: hbwired-addon_${{ steps.version.outputs.VERSION }}.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Draft Release (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          name: "HBWired CCU Addon v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ steps.version.outputs.VERSION }}
          files: hbwired-addon_${{ steps.version.outputs.VERSION }}.tgz
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
